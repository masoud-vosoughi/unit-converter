
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter</title>
</head>
<body>

    <h1>Unit Converter</h1>
    <p>Convert between length and weight units.</p>

    <form action="/" method="POST">

        <label for="category">Conversion Type:</label>
        <select id="category" name="category" required>
            <option value="length">Length</option>
            <option value="weight">Weight</option>
        </select>

        <br><br>

        <label for="value">Enter Value:</label>
        <input
            type="number"
            id="value"
            name="value"
            step="any"
            required
        >

        <br><br>

        <label for="from_unit">From:</label>
        <select id="from_unit" name="from_unit" required></select>

        <br><br>

        <label for="to_unit">To:</label>
        <select id="to_unit" name="to_unit" required></select>

        <br><br>

        <button type="submit">Convert</button>

    </form>

    {% if result is not none %}
        <p>Result: {{ result }}</p>
    {% endif %}

    {% if error %}
        <p style="color: red;">Error: {{ error }}</p>
    {% endif %}

    <script>
        const units = {
            length: [
                ["mm", "Millimeter"],
                ["cm", "Centimeter"],
                ["m", "Meter"],
                ["km", "Kilometer"],
                ["in", "Inch"],
                ["ft", "Foot"],
                ["yd", "Yard"],
                ["mi", "Mile"]
            ],
            weight: [
                ["mg", "Milligram"],
                ["g", "Gram"],
                ["kg", "Kilogram"],
                ["oz", "Ounce"],
                ["lb", "Pound"]
            ]
        };

        const categorySelect = document.getElementById("category");
        const fromSelect = document.getElementById("from_unit");
        const toSelect = document.getElementById("to_unit");

        function updateUnits() {
            const selectedUnits = units[categorySelect.value];

            for (const select of [fromSelect, toSelect]) {
                select.innerHTML = "";

                const placeholder = new Option("Select unit", "");
                placeholder.disabled = true;
                placeholder.selected = true;
                select.add(placeholder);

                for (const [value, label] of selectedUnits) {
                    select.add(new Option(label, value));
                }
            }
        }

        categorySelect.addEventListener("change", updateUnits);
        updateUnits();
    </script>

</body>
</html>
