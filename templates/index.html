
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter</title>
</head>
<body>

    <h1>Unit Converter</h1>

    <p>Convert between different length units.</p>

    <form action="/" method="POST">

        <label for="value">Enter Value:</label>
        <input
            type="number"
            id="value"
            name="value"
            step="any"
            required
        >

        <br><br>

        <label for="from_unit">From:</label>
        <select id="from_unit" name="from_unit" required>
            <option value="" disabled selected>Select source unit</option>
            <option value="mm">Millimeter</option>
            <option value="cm">Centimeter</option>
            <option value="m">Meter</option>
            <option value="km">Kilometer</option>
        </select>

        <br><br>

        <label for="to_unit">To:</label>
        <select id="to_unit" name="to_unit" required>
            <option value="" disabled selected>Select target unit</option>
            <option value="mm">Millimeter</option>
            <option value="cm">Centimeter</option>
            <option value="m">Meter</option>
            <option value="km">Kilometer</option>
        </select>

        <br><br>

        <button type="submit">Convert</button>

    </form>

    {% if result is not none %}
    <p>Result: {{ result }}</p>
    {% endif %}
    {% if error %}
    <p style="color: red;">Error: {{ error }}</p>
    {% endif %}

</body>
</html>
